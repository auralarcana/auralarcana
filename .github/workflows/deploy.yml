name: Buduj i wdroz na Hostingera
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Paczka zmian wgrana przez przeglądarkę (bundle.tgz) jest rozpakowywana i commitowana
      # przed buildem; to samo dla gałęzi roboczych robi rozpakuj.yml.
      - name: Rozpakowanie paczki zmian
        run: |
          if [ -f bundle.tgz ]; then
            tar xzf bundle.tgz
            if [ -f bundle-usun.txt ]; then
              while read -r f; do [ -n "$f" ] && git rm -rq --ignore-unmatch -- "$f"; rm -rf -- "$f"; done < bundle-usun.txt
              rm -f bundle-usun.txt
            fi
            git rm -q bundle.tgz
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Rozpakowanie paczki zmian [skip ci]" || true
            git push
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalacja
        working-directory: strona
        run: npm ci || npm install
      - name: Build
        working-directory: strona
        run: npm run build
      - name: Sprawdzenie buildu
        working-directory: strona
        run: |
          test -f out/index.html || { echo "Brak out/index.html"; exit 1; }
          test -f out/.htaccess || echo "UWAGA: brak .htaccess"
          test -f out/.well-known/ai.txt || echo "UWAGA: brak .well-known/ai.txt"
      - name: lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Diagnostyka FTP
        env:
          SERWER: ${{ secrets.FTP_SERWER }}
          LOGIN: ${{ secrets.FTP_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.FTP_HASLO }}
        run: |
          lftp --env-password -u "$LOGIN" "$SERWER" <<'KONIEC'
          debug 3
          set ftp:ssl-allow false
          set ftp:use-feat false
          set ftp:use-host false
          set net:max-retries 1
          set net:timeout 20
          ls
          quit
          KONIEC
      - name: Wysylka FTP
        env:
          SERWER: ${{ secrets.FTP_SERWER }}
          LOGIN: ${{ secrets.FTP_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.FTP_HASLO }}
        run: |
          lftp --env-password -u "$LOGIN" "$SERWER" <<'KONIEC'
          set ftp:ssl-allow false
          set ftp:use-feat false
          set ftp:use-host false
          set net:max-retries 3
          set net:timeout 20
          mirror --reverse --delete --verbose --parallel=4 --exclude-glob .git/ strona/out/ /
          quit
          KONIEC
